<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大戰略">
<meta name="theme-color" content="#0f141a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>大戰略 Web</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=72">
<link rel="shortcut icon" href="favicon.svg?v=72">
<link rel="apple-touch-icon" id="appleIcon" href="favicon.svg?v=72">
<link rel="stylesheet" href="style.css?v=72">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" id="btnMenu" title="主選單">大戰略</div>
    <div id="turnInfo" class="pill"></div>
    <div id="funds"></div>
    <div class="spacer"></div>
    <button id="btnAllyCtrl" class="hidden" title="切換友軍操控模式：手動指揮 / 電腦AI協同">友軍: 手動</button>
    <button id="btnNext" title="下一個未行動部隊 (Tab)">下一部隊</button>
    <button id="btnAutoPilot" class="btn-autopilot" title="由電腦 AI 代理指揮本回合（可隨時中斷）">🤖 電腦代理</button>
    <button id="btnEnd" class="primary">結束回合</button>
    <span class="sep"></span>
    <button id="btnCampaign" title="劇情模式或自由對戰">劇情・對戰</button>
    <button id="btnSave">存檔</button>
    <button id="btnLoad">讀檔</button>
    <button id="btnHelp">說明</button>
    <button id="btnMore" title="選單">☰</button>
  </header>
  <main>
    <div id="mapWrap">
      <canvas id="map"></canvas>
      <div id="actionMenu" class="hidden"></div>
      <div id="banner" class="hidden"></div>
      <div id="toast" class="hidden"></div>
      <div id="resultBar" class="hidden"><span>🏁 <b id="resultText">作戰結束</b>　正在檢視戰場</span><button id="resultGo" class="primary">查看結果</button></div>
      <div id="autoPilotBar" class="autopilot-banner hidden">
        <div class="ap-status">
          <span class="ap-pulse"></span>
          <span class="ap-title">🤖 <b>電腦代理指揮中</b></span>
          <span id="apPersonaBadge" class="ap-badge" title="目前 AI 戰術風格">B 綜合型</span>
        </div>
        <div class="ap-actions">
          <button id="apPersonaCycle" class="btn-ap-sub" title="切換代理戰術風格">風格: <b>B</b> ▾</button>
          <button id="btnStopAutoPilot" class="btn-ap-stop" title="立即取回指揮權">⏹️ 中斷代理</button>
        </div>
      </div>
      <div id="deployBar" class="hidden">
        <div class="deploy-header">
          <div class="dtitle">🪖 <b>部隊配置</b>：從待命名單點選繼承部隊，再點綠色配置區放下</div>
          <div class="deploy-actions">
            <button id="deployToggle" class="muted deploy-toggle" title="收合/展開配置名單" type="button">收合 ▴</button>
            <button id="deployGo" class="primary" type="button">開始作戰</button>
          </div>
        </div>
        <div id="reserveList"></div>
      </div>
      <button id="cancelBtn" class="hidden" title="取消（右鍵 / Esc）">✕ 取消</button>
      <button id="btnPanel" title="顯示/隱藏側欄">▤</button>
      <div id="zoomCtl"><button id="zMusic" title="背景音樂">♪</button><button id="zSfx" title="音效">🔊</button><button id="zTrack" title="切換背景音樂曲目">🎼</button><button id="zLabel" title="顯示/隱藏兵種名稱">名</button><button id="zIn" title="放大">＋</button><button id="zOut" title="縮小">－</button></div>
    </div>
    <aside id="panel">
      <canvas id="mini"></canvas>
      <section id="unitInfo" class="card"></section>
      <section id="forecast" class="card hidden"></section>
      <section id="objCard" class="card obj-card hidden"></section>
      <section id="tileInfo" class="card"></section>
      <section class="card logcard"><h3>戰況</h3><div id="log"></div></section>
    </aside>
  </main>
</div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>
<div id="rotateHint"><div class="phone">📱</div><p>請將手機橫放<br>以獲得最佳遊戲體驗</p><button id="rotateOk">仍要直向遊玩</button></div>
<script src="js/data.js?v=72"></script>
<script src="js/audio.js?v=72"></script>
<script src="js/game.js?v=72"></script>
<script src="js/map.js?v=72"></script>
<script src="js/icons.js?v=72"></script>
<script src="js/render.js?v=72"></script>
<script src="js/ai.js?v=72"></script>
<script src="js/campaign.js?v=72"></script>
<script src="js/campaign_tw.js?v=72"></script>
<script src="js/campaign_fs.js?v=72"></script>
<script src="js/campaign_ge.js?v=72"></script>
<script src="js/campaign_qian.js?v=72"></script>
<script src="js/saves.js?v=72"></script>
<script src="js/ui.js?v=72"></script>
</body>
</html>
