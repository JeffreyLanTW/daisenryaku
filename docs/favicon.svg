<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d24"/>
      <stop offset="100%" stop-color="#0f1712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#c8962e"/>
    </linearGradient>
  </defs>
  <!-- 戰術六角格底板 -->
  <polygon points="32,3 58,17.5 58,46.5 32,61 6,46.5 6,17.5" fill="url(#bg)" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="32,7.5 54,19.8 54,44.2 32,56.5 10,44.2 10,19.8" fill="none" stroke="#3a5240" stroke-width="1"/>
  <!-- 頂部指揮金星 -->
  <polygon points="32,10 33.9,14.2 38.5,14.7 35,17.8 36,22.3 32,19.9 28,22.3 29,17.8 25.5,14.7 30.1,14.2" fill="url(#gold)"/>
  <!-- 主力戰車剪影（高對比金色裝甲與砲管，16x16 依然清晰） -->
  <!-- 主砲管 -->
  <rect x="34" y="25.5" width="20" height="3.6" rx="1.5" fill="url(#gold)"/>
  <rect x="50" y="24.7" width="4.5" height="5.2" rx="1" fill="#ffe082"/>
  <!-- 傾斜裝甲砲塔 -->
  <path d="M18,31 L23,24 L38,24 L42,31 Z" fill="url(#gold)"/>
  <rect x="24" y="22" width="7" height="2.2" rx="1" fill="#ffe082"/>
  <!-- 車體裝甲 -->
  <path d="M11,38 L15,32.5 L49,32.5 L53,38 Z" fill="#8aa37b"/>
  <!-- 履帶與路輪 -->
  <rect x="12" y="38" width="40" height="9" rx="4.5" fill="#101813" stroke="url(#gold)" stroke-width="2.2"/>
  <circle cx="18.5" cy="42.5" r="2.2" fill="#e0b54a"/>
  <circle cx="25.2" cy="42.5" r="2.2" fill="#e0b54a"/>
  <circle cx="32" cy="42.5" r="2.2" fill="#e0b54a"/>
  <circle cx="38.8" cy="42.5" r="2.2" fill="#e0b54a"/>
  <circle cx="45.5" cy="42.5" r="2.2" fill="#e0b54a"/>
</svg>
